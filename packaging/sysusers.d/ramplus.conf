# RamPlus: группы доступа к демону ramplusd и пользователь веб-интерфейса.
#   ramplus       — чтение (status, history, plan) и доступ к сокету
#   ramplus-admin — изменения (apply); участник должен быть и в ramplus
#   ramplus-web   — системный пользователь ramplus-web (не root); его группа
#                   читает /etc/ramplus/web-auth (root:ramplus-web 0640)
g ramplus       -
g ramplus-admin -
u ramplus-web   - "RamPlus web interface" - -
m ramplus-web   ramplus
m ramplus-web   ramplus-admin
